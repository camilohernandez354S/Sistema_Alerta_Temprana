version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: sat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=sat_database
    networks:
      - sat-network

  # Backend Flask
  backend:
    build:
      context: ./backend/backend-flask
      dockerfile: Dockerfile
    container_name: sat-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/backend-flask:/app
      - ./.env:/app/.env
      - ./scripts:/scripts:ro
      - ./backend/arduino:/app/../arduino:ro
      - ./qr_codes:/qr_codes
      - /var/run/docker.sock:/var/run/docker.sock  # Socket de Docker para ejecutar comandos del host
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - MONGO_URI=mongodb://mongo:27017/
      - MONGO_DB=sat_database
      - CORS_ORIGINS=http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080
      - ARDUINO_ENABLED=True
    command: python run.py
    depends_on:
      - mongo
    networks:
      - sat-network

  # Frontend Vue.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sat-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sat-network

  # Arduino Reader (Solo desarrollo local - requiere hardware físico)
  # NOTA: En Windows, el acceso al puerto serial desde Docker es limitado
  # Si usas Arduino por WiFi (ESP8266/ESP32), NO necesitas este servicio
  # Solo descomenta si usas Arduino por puerto serial y estás en Linux
  # arduino-reader:
  #   build:
  #     context: ./backend
  #     dockerfile: arduino/Dockerfile
  #   container_name: sat-arduino-reader
  #   restart: unless-stopped
  #   volumes:
  #     - ./backend/arduino:/app
  #     - ./.env:/app/.env:ro
  #   environment:
  #     - ARDUINO_PORT=${ARDUINO_PORT:-/dev/ttyUSB0}
  #     - ARDUINO_BAUDRATE=${ARDUINO_BAUDRATE:-9600}
  #     - FLASK_SERVER_URL=http://backend:5000
  #     - MONGO_URI=mongodb://mongo:27017/
  #     - MONGO_DB=sat_database
  #   devices:
  #     - /dev/ttyUSB0:/dev/ttyUSB0  # Linux
  #   depends_on:
  #     - backend
  #     - mongo
  #   networks:
  #     - sat-network

  # Mongo Express (Opcional - Interfaz web para MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: sat-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    networks:
      - sat-network

volumes:
  mongo_data:
    driver: local

networks:
  sat-network:
    driver: bridge

