<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
</head>
<body>
    <h1>Test de Login</h1>
    <button onclick="testLogin()">Probar Login</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Probando...';
            
            try {
                console.log('🔍 Probando login...');
                
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                console.log('📊 Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Success:', data);
                
                resultDiv.innerHTML = `
                    <h3>✅ Login Exitoso!</h3>
                    <p><strong>Mensaje:</strong> ${data.mensaje}</p>
                    <p><strong>Rol:</strong> ${data.rol}</p>
                    <p><strong>Token:</strong> ${data.token.substring(0, 50)}...</p>
                `;
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                    <h4>Posibles soluciones:</h4>
                    <ul>
                        <li>Verificar que el backend esté corriendo en puerto 5000</li>
                        <li>Verificar configuración CORS</li>
                        <li>Abrir herramientas de desarrollador para ver detalles</li>
                    </ul>
                `;
            }
        }
        
        // Auto-test al cargar la página
        window.onload = function() {
            console.log('🌐 Página cargada, listo para probar');
        };
    </script>
</body>
</html>
