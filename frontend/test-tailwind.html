<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Test Tailwind CSS</h1>
        
        <div class="space-y-4">
            <p class="text-sm text-gray-600">Esta es una clase text-sm</p>
            <p class="text-base text-gray-700">Esta es una clase text-base</p>
            <p class="text-lg text-gray-800">Esta es una clase text-lg</p>
            
            <div class="flex space-x-2">
                <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                    Botón Azul
                </button>
                <button class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                    Botón Verde
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 bg-red-100 rounded-lg">
                    <h3 class="font-semibold text-red-800">Alerta Roja</h3>
                    <p class="text-sm text-red-600">Contenido de la alerta</p>
                </div>
                <div class="p-4 bg-yellow-100 rounded-lg">
                    <h3 class="font-semibold text-yellow-800">Alerta Amarilla</h3>
                    <p class="text-sm text-yellow-600">Contenido de la alerta</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
